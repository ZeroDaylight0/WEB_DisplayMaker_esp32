services:
  pixelforge:
    build: .
    ports:
      - "4173:4173"
    # By default only the first account can be created. Uncomment to change that:
    # environment:
    #   PIXELFORGE_ALLOW_REGISTRATION: "1"   # anyone can create an account
    #   PIXELFORGE_ALLOW_REGISTRATION: "0"   # nobody can, not even the first
    volumes:
      - pixelforge-data:/data
    restart: unless-stopped

volumes:
  pixelforge-data:
