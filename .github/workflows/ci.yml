name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '20.x'
          - os: ubuntu-latest
            node-version: '21.4.0'
          - os: ubuntu-latest
            node-version: '22.x'
          - os: ubuntu-latest
            node-version: '24.x'
          - os: windows-latest
            node-version: '20.x'
          - os: windows-latest
            node-version: '22.x'
          - os: windows-latest
            node-version: '24.x'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test editor
        run: npm test
      - name: Test API
        run: npm run test:server
